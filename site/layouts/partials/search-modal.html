<dialog id="site-search-modal" class="site-search-modal"
  data-index-url="{{ "index.json" | relURL }}">
  <div class="site-search-header">
    <div class="site-search-input-wrapper">
      <span class="site-search-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </span>
      <input type="text" class="site-search-input" id="site-search-input"
        placeholder="Search designs, principles, deep dives..." aria-label="Search" autocomplete="off" autofocus />
      <button class="site-search-close" data-close-search aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="lucide lucide-x">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>
  </div>
  <div class="site-search-body">
    <div id="site-search-default" class="site-search-default">
      <div class="site-search-quick-links">
        <a href="{{ relURL "categories/" }}" class="site-search-cta">
          <span class="site-search-cta-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-folder">
              <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
            </svg>
          </span>
          <span class="site-search-cta-text">All Categories</span>
        </a>
        <a href="{{ relURL "tags/" }}" class="site-search-cta">
          <span class="site-search-cta-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              class="lucide lucide-tag">
              <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
              <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
            </svg>
          </span>
          <span class="site-search-cta-text">All Tags</span>
        </a>
      </div>
    </div>
    <div id="site-search-results-list" style="display: none;">
      <!-- Results injected here -->
    </div>
  </div>
</dialog>

{{ $search := resources.Get "js/search.js" | minify | fingerprint }}
<script src="{{ $search.RelPermalink }}" defer></script>
